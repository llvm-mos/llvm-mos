name: Packaging
concurrency: compiler-package
on:
  workflow_dispatch:
  push:
    ignore-forks: true
    branches: [main]
    paths:
      - 'clang/**'
      - 'compiler-rt/**'
      - 'lld/**'
      - 'llvm/**'
      - '.github/workflows/package.yml'
jobs:
  package:
    if: github.repository_owner == 'llvm-mos'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, macos-latest, ubuntu-22.04]
    steps:
      - name: Setup Windows
        if: startsWith(matrix.os, 'windows')
        uses: llvm/actions/setup-windows@main
        with:
          arch: amd64
      # On Windows, starting with win19/20220814.1, cmake choose the 32-bit
      # python3.10.6 libraries instead of the 64-bit libraries when building
      # lldb.  Using this setup-python action to make 3.10 the default
      # python fixes this.
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Ninja
        uses: llvm/actions/install-ninja@main

      # actions/checkout deletes any existing files in the new git directory,
      # so this needs to either run before ccache-action or it has to use
      # clean: false.
      - name: Checkout
        uses: actions/checkout@v4

      # LLDB needs libxml2 to read a gdbstub's target.xml (see MOS.cmake).
      # Linux links the system's shared libxml2, as upstream's Linux release
      # does, and macOS has one in its SDK.
      - name: Install libxml2 (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev

      # Windows has no system libxml2. Build a minimal static one the way
      # upstream's Windows release does (llvm/utils/release/build_llvm_release.bat),
      # but with the DLL C runtime (/MD) that this build uses.
      - name: Build libxml2 (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "2.15.3"
          $src = "libxml2-v$version"
          $prefix = "${{ runner.temp }}/libxml2" -replace '\\', '/'
          Set-Location "${{ runner.temp }}"
          curl.exe -fsSLO "https://gitlab.gnome.org/GNOME/libxml2/-/archive/v$version/$src.tar.gz"
          $hash = (Get-FileHash "$src.tar.gz" -Algorithm SHA256).Hash
          if ($hash -ne "0da50c1415f4ec0364569d2119b1436ba837b31df44af28569d234272c23cf1f") {
            throw "libxml2 checksum mismatch: $hash"
          }
          # 'test' directory excluded because of symlinks.
          tar zxf "$src.tar.gz" --exclude "test/*"
          cmake -GNinja -S $src -B libxmlbuild `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DBUILD_SHARED_LIBS=OFF -DLIBXML2_WITH_C14N=OFF -DLIBXML2_WITH_CATALOG=OFF `
            -DLIBXML2_WITH_DEBUG=OFF -DLIBXML2_WITH_DOCB=OFF -DLIBXML2_WITH_FTP=OFF `
            -DLIBXML2_WITH_HTML=OFF -DLIBXML2_WITH_HTTP=OFF -DLIBXML2_WITH_ICONV=OFF `
            -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_ISO8859X=OFF -DLIBXML2_WITH_LEGACY=OFF `
            -DLIBXML2_WITH_LZMA=OFF -DLIBXML2_WITH_MEM_DEBUG=OFF -DLIBXML2_WITH_MODULES=OFF `
            -DLIBXML2_WITH_OUTPUT=ON -DLIBXML2_WITH_PATTERN=OFF -DLIBXML2_WITH_PROGRAMS=OFF `
            -DLIBXML2_WITH_PUSH=OFF -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_READER=OFF `
            -DLIBXML2_WITH_REGEXPS=OFF -DLIBXML2_WITH_RUN_DEBUG=OFF -DLIBXML2_WITH_SAX1=ON `
            -DLIBXML2_WITH_SCHEMAS=OFF -DLIBXML2_WITH_SCHEMATRON=OFF -DLIBXML2_WITH_TESTS=OFF `
            -DLIBXML2_WITH_THREADS=ON -DLIBXML2_WITH_THREAD_ALLOC=OFF -DLIBXML2_WITH_TREE=ON `
            -DLIBXML2_WITH_VALID=OFF -DLIBXML2_WITH_WRITER=OFF -DLIBXML2_WITH_XINCLUDE=OFF `
            -DLIBXML2_WITH_XPATH=OFF -DLIBXML2_WITH_XPTR=OFF -DLIBXML2_WITH_ZLIB=OFF
          ninja -C libxmlbuild install
          "LIBXML2_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Configure POSIX
        if: ${{!startsWith(matrix.os, 'windows')}}
        run: |
          mkdir build
          cd build
          cmake \
            -GNinja \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/llvm-mos \
            -C../clang/cmake/caches/MOS.cmake \
            ../llvm

      - name: Configure Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          mkdir build
          cd build
          cmake `
            -GNinja `
            -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/llvm-mos `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DLIBXML2_INCLUDE_DIR="$env:LIBXML2_PREFIX/include/libxml2" `
            -DLIBXML2_LIBRARIES="$env:LIBXML2_PREFIX/lib/libxml2s.lib" `
            -DCMAKE_C_FLAGS=-DLIBXML_STATIC `
            -DCMAKE_CXX_FLAGS=-DLIBXML_STATIC `
            -DCMAKE_EXE_LINKER_FLAGS=bcrypt.lib `
            -DCMAKE_SHARED_LINKER_FLAGS=bcrypt.lib `
            -C../clang/cmake/caches/MOS.cmake `
            ../llvm

      - name: Build
        run: cd build; ninja distribution

      - name: Install
        run: cd build; ninja install-distribution-stripped

      - name: Archive Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: tar -cJvf llvm-mos-linux-main.tar.xz llvm-mos
      - name: Archive Windows
        if: startsWith(matrix.os, 'windows')
        run: 7z a llvm-mos-windows-main.7z llvm-mos
      - name: Archive macOS
        if: startsWith(matrix.os, 'macos')
        run: tar -cJvf llvm-mos-darwin-main.tar.xz llvm-mos

      - name: Release Linux
        if: startsWith(matrix.os, 'ubuntu')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          prerelease: true
          body: "Internal compiler build for Linux"
          tag_name: llvm-mos-linux-main
          files: llvm-mos-linux-main.tar.xz

      - name: Release macOS
        if: startsWith(matrix.os, 'macos')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          prerelease: true
          body: "Internal compiler build for macOS"
          tag_name: llvm-mos-darwin-main
          files: llvm-mos-darwin-main.tar.xz

      - name: Release Windows
        if: startsWith(matrix.os, 'windows')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          prerelease: true
          body: "Internal compiler build for Windows"
          tag_name: llvm-mos-windows-main
          files: llvm-mos-windows-main.7z
  dispatch-sdk:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch SDK Packaging
        uses: llvm-mos/repository-dispatch@v1
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          repository: llvm-mos/llvm-mos-sdk
          event-type: on-llvm-update
          client-payload: '{"head_commit": ${{ toJSON(github.event.head_commit) }}}'
